name: verify-task-tutorial

on:
  pull_request:
    paths:
      - "tutorials/swin_segmentation_task_inference.ipynb"
      - "tutorials/README.md"
      - "src/dimer_swin_segmentation/**"
      - "tools/**"
      - "weights/**/dimer-base-manifest.json"
      - "pyproject.toml"
      - ".github/workflows/verify-task-tutorial.yml"
  workflow_dispatch:

jobs:
  execute-task-tutorial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install notebook executor
        run: |
          python -m pip install --disable-pip-version-check "nbconvert==7.16.6" "nbformat==5.10.4" "ipykernel==6.29.5"
          python -m ipykernel install --user --name python3 --display-name "Python 3"
      - name: Validate notebook source (standalone carrier, NOTEBOOK_SPEC 1.1)
        run: |
          python - <<'PY'
          import ast, json
          from pathlib import Path
          p=Path('tutorials/swin_segmentation_task_inference.ipynb')
          nb=json.loads(p.read_text(encoding='utf-8'))
          dimer=nb['metadata']['dimer']
          assert dimer['notebook_profile']=='TASK-INFERENCE' and dimer['notebook_spec']=='1.1' and dimer['standalone'] is True, dimer
          text=p.read_text(encoding='utf-8')
          for marker in ('TODO','TBD','FIXME'):
              assert marker not in text
          for cell in nb['cells']:
              if cell['cell_type']=='code':
                  ast.parse(''.join(cell['source']))
                  assert cell.get('execution_count') is None
                  assert cell.get('outputs')==[]
          print('standalone TASK-INFERENCE notebook source: PASS')
          PY
      - name: Execute the exact notebook from a scratch directory (no repository checkout on its path)
        run: |
          mkdir -p "$RUNNER_TEMP/standalone-run"
          cp tutorials/swin_segmentation_task_inference.ipynb "$RUNNER_TEMP/standalone-run/"
          cd "$RUNNER_TEMP/standalone-run"
          python -m nbconvert --to notebook --execute swin_segmentation_task_inference.ipynb \
            --output task-inference-executed.ipynb --ExecutePreprocessor.timeout=1500
      - name: Assert machine-readable outputs
        run: |
          cd "$RUNNER_TEMP/standalone-run"
          test -s outputs/swin_segmentation_task_inference_input_manifest.json
          test -s outputs/swin_segmentation_task_inference_evaluation_report.json
          test -s outputs/swin_segmentation_task_inference_result.json
          test -s outputs/swin_segmentation_task_inference_class_coverage.csv
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('outputs')
          manifest=json.loads((root/'swin_segmentation_task_inference_input_manifest.json').read_text(encoding='utf-8'))
          report=json.loads((root/'swin_segmentation_task_inference_evaluation_report.json').read_text(encoding='utf-8'))
          result=json.loads((root/'swin_segmentation_task_inference_result.json').read_text(encoding='utf-8'))
          assert manifest['verdict']=='accepted' and manifest['findings'], manifest
          assert report['verdict']=='not-measurable', report['verdict']  # default synthetic path has no ground truth
          assert result['checkpoint_sha256']=='e380ad3e5d94060d89e4b62b5d393cdcc7f1f3406b1d46bcab547d3c276b6064'
          assert result['runtime']['mmseg']=='1.2.2' and result['runtime']['python'].startswith('3.10.')
          print(json.dumps({'notebook_source':result['notebook_source'],'runtime':result['runtime'],'verdict':report['verdict'],'n_predictions':len(result['predictions'])}, indent=2))
          PY
