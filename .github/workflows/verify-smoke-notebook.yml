name: verify-smoke-notebook

on:
  pull_request:
    paths:
      - "tutorials/**"
      - "MODEL_CARD.md"
      - "spec/**"
      - "provenance/**"
      - "scripts/verify_scaffold.py"
      - ".github/workflows/verify-smoke-notebook.yml"
  workflow_dispatch:

jobs:
  execute-smoke-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install notebook executor
        run: python -m pip install --disable-pip-version-check "nbconvert==7.16.6" "nbformat==5.10.4"
      - name: Validate notebook source hygiene
        run: |
          python - <<'PY'
          import ast, json
          from pathlib import Path
          p = Path("tutorials/swin_segmentation_scaffold_smoke_colab.ipynb")
          nb = json.loads(p.read_text())
          assert nb["metadata"]["dimer"] == {"notebook_profile": "SMOKE", "notebook_spec": "1.0"}
          for cell in nb["cells"]:
              if cell["cell_type"] == "code":
                  ast.parse(cell["source"])
                  assert cell.get("execution_count") is None
                  assert cell.get("outputs") == []
          print("notebook source hygiene: PASS")
          PY
      - name: Execute smoke notebook from a clean workspace
        env:
          DIMER_TUTORIAL_WORKSPACE: ${{ runner.temp }}/swin-segmentation-pipeline
        run: |
          python -m nbconvert --to notebook --execute tutorials/swin_segmentation_scaffold_smoke_colab.ipynb \
            --output smoke-executed.ipynb --output-dir "$RUNNER_TEMP" \
            --ExecutePreprocessor.timeout=300
