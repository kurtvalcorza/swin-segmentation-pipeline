name: probe-task-inference-runtime

on:
  pull_request:
    paths:
      - "scripts/probe_task_inference_runtime.py"
      - ".github/workflows/probe-task-inference-runtime.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install pinned CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.1.2" "torchvision==0.16.2"
          python -m pip install "openmim==0.3.9"
          mim install "mmengine==0.10.7"
          mim install "mmcv==2.1.0"
          python -m pip install "mmsegmentation==1.2.2" "ftfy==6.3.1"
          # Torch 2.1 / OpenMMLab CPU wheels were built against NumPy 1.x.
          # OpenCV 5 pulls NumPy 2 on current PyPI, so pin both sides of the ABI boundary.
          python -m pip install --force-reinstall "numpy==1.26.4" "opencv-python==4.10.0.84"
          python -m pip check
      - name: Probe official Swin UPerNet task inference
        run: python scripts/probe_task_inference_runtime.py
